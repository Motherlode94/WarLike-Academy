<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d18"><meta name="description" content="WarLike Academy - suite WarLike"><title>WarLike Academy</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#e8ecf6;background:#090d18}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #a78bfa;outline-offset:2px}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}.side{background:#101625;border-right:1px solid #263044;padding:24px 16px}.brand{font-weight:850;font-size:19px;letter-spacing:.5px;margin:0 0 30px}.brand span{color:#a78bfa}.nav{display:grid;gap:7px}.nav button{background:transparent;border:0;color:#aebbd2;text-align:left;padding:13px 14px;border-radius:11px}.nav button.active,.nav button:hover{background:#222c43;color:#fff}.main{min-width:0;padding:32px;max-width:1350px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}.muted{color:#9aa9c0}.small{font-size:13px}h1{font-size:29px;margin:6px 0 12px}h2{font-size:20px}h3{font-size:17px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:22px 0}.panel{background:#151d2d;border:1px solid #2a364d;border-radius:17px;padding:20px;min-width:0}.panel h3{margin:5px 0}.stat{font-size:30px;font-weight:750}.primary{background:#7958e8;color:white;border:0;border-radius:10px;padding:11px 17px}.secondary{background:#26324a;color:white;border:1px solid #40516d;border-radius:10px;padding:10px 15px}.danger{background:#4b2332;color:#ffb9bf;border:1px solid #7c334c;border-radius:10px;padding:9px 12px}.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.stack{display:grid;gap:14px}.field{display:grid;gap:5px;margin:10px 0}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #43516b;background:#0e1422;color:#e8ecf6}.field textarea{min-height:85px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:560px}.table th,.table td{text-align:left;padding:13px 9px;border-bottom:1px solid #303c50}.table th{color:#9aa9c0;font-size:13px}.pill{font-size:12px;background:#2f3c56;padding:5px 9px;border-radius:99px;display:inline-block}.hidden{display:none!important}.bar{height:8px;background:#344258;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:#9b82ff}.footer{font-size:12px;color:#91a0b7;margin-top:25px}.notice{border-left:3px solid #9b82ff;padding:12px;background:#222a3d;color:#dce3f0;border-radius:8px;margin:14px 0}@media(max-width:750px){.layout{display:block}.side{position:static;border-right:0;border-bottom:1px solid #263044;padding:16px}.brand{margin-bottom:12px}.nav{display:flex;overflow-x:auto}.nav button{white-space:nowrap}.main{padding:20px 14px}h1{font-size:24px}}</style></head><body><div class="layout"><aside class="side"><div class="brand">WARLIKE <span>ACADEMY</span></div><nav class="nav" aria-label="Navigation principale"><button data-view="dashboard" class="active">📊 Tableau de bord</button><button data-view="catalog">📚 Formations</button><button data-view="learn">💻 Apprendre</button><button data-view="progress">🏅 Progression</button></nav></aside><main class="main"><div class="top"><div><div class="muted small">WARLIKE / LEARNING</div><h1 id="title">Tableau de bord</h1></div><button id="reset" class="secondary">Réinitialiser la démo</button></div><div class="notice">Version MVP locale : la progression reste sur cet appareil. Aucun compte WarLike Keys ni certificat officiel n'est encore connecté.</div><section id="app" aria-live="polite"></section><div class="footer">WarLike Academy · Démo navigateur · Formation autonome</div></main></div><script>
"use strict";
const courses=[
{id:"web",title:"JavaScript & TypeScript",tag:"Développement",desc:"Les fondamentaux du Web, du DOM et du typage.",lessons:[{title:"Variables et types",content:"Une variable let peut être réaffectée. const protège la liaison. TypeScript ajoute des annotations de type pour détecter des erreurs avant l'exécution.",q:"Quel mot-clé interdit la réaffectation d'une variable ?",options:["let","const","var"],correct:1},{title:"Fonctions",content:"Une fonction encapsule un comportement. En TypeScript, les paramètres et la valeur de retour peuvent être typés.",q:"Quelle syntaxe déclare une fonction ?",options:["function calculer() {}","make calculer()","new function calculer"],correct:0},{title:"DOM et événements",content:"Le DOM représente la page. addEventListener réagit à un clic, une saisie ou un autre événement.",q:"Quelle méthode écoute un événement ?",options:["queryAll()","addEventListener()","listenNow()"],correct:1}]},
{id:"unity",title:"C# pour WarLike Engine",tag:"Jeux vidéo",desc:"Composants, classes, boucle Update et physique.",lessons:[{title:"Classes et composants",content:"Une classe définit données et comportements. Un composant enrichit une entité de jeu.",q:"Quel mot-clé déclare une classe C# ?",options:["class","structural","module"],correct:0},{title:"Cycle de vie",content:"Awake initialise; Start prépare; Update exécute une logique liée aux images.",q:"Quelle méthode revient à chaque image ?",options:["Start","Update","OnDestroy"],correct:1},{title:"Physique",content:"Un Rigidbody donne une dynamique à un objet; un Collider définit sa géométrie de collision.",q:"Quel composant décrit une collision ?",options:["Camera","Light","Collider"],correct:2}]},
{id:"audio",title:"Production dans WarLike Studio",tag:"Musique",desc:"Pistes, enregistrement, égalisation et mastering.",lessons:[{title:"Organisation de session",content:"Séparer voix, batterie et instruments facilite le mix. Garder une marge de niveau avant le mastering.",q:"Quelle pratique facilite le mixage ?",options:["Tout sur une piste","Séparer les sources","Tout normaliser à 0 dBFS"],correct:1},{title:"Égalisation",content:"Un égaliseur ajuste les bandes de fréquences. Une coupe peut libérer de la place pour la voix.",q:"L'EQ agit sur ?",options:["Les fréquences","La durée du morceau","La taille du fichier uniquement"],correct:0},{title:"Mastering",content:"Le mastering finalise l'équilibre et le niveau de sortie sans remplacer un bon mixage.",q:"À quel moment intervient généralement le mastering ?",options:["Avant les prises","Après le mixage","Pendant l'accordage uniquement"],correct:1}]},
{id:"model",title:"Modélisation & Rig 3D",tag:"3D",desc:"Maillages, matériaux, rigging et animation.",lessons:[{title:"Maillages 3D",content:"Les sommets, arêtes et faces forment un maillage polygonal.",q:"De quoi un mesh est-il composé ?",options:["Pixels uniquement","Sommets et faces","Pistes MIDI"],correct:1},{title:"Matériaux PBR",content:"Les cartes de base color, roughness et metallic décrivent l'apparence de la surface.",q:"Quelle carte contrôle la rugosité ?",options:["Roughness","Skeleton","Velocity"],correct:0},{title:"Squelette",content:"Un rig lie des os au maillage pour produire des poses et animations.",q:"Quel élément sert à articuler un personnage ?",options:["Timeline audio","Squelette","Texture diffuse"],correct:1}]}];
const KEY="warlike-academy-demo-v1";const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}};let state=load(),view="dashboard",selected="web",step=0;const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const done=id=>Object.keys(state[id]||{}).filter(k=>state[id][k]===true).length;const total=()=>courses.reduce((n,c)=>n+done(c.id),0);const percent=c=>Math.round(100*done(c.id)/c.lessons.length);
function render(){document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));document.getElementById("title").textContent=({dashboard:"Tableau de bord",catalog:"Catalogue de formations",learn:"Espace d'apprentissage",progress:"Ma progression"})[view];const a=document.getElementById("app");if(view==="dashboard"){a.innerHTML='<div class="grid"><div class="panel"><div class="muted">Parcours</div><div class="stat">'+courses.length+'</div></div><div class="panel"><div class="muted">Leçons validées</div><div class="stat">'+total()+' / 12</div></div><div class="panel"><div class="muted">Parcours terminés</div><div class="stat">'+courses.filter(c=>percent(c)===100).length+'</div></div></div><h2>Reprendre une formation</h2>'+cards();}else if(view==="catalog"){a.innerHTML='<p class="muted">Quatre parcours avec 3 leçons interactives et un quiz chacun.</p>'+cards()}else if(view==="progress"){a.innerHTML='<div class="stack">'+courses.map(c=>'<div class="panel"><div class="top"><strong>'+esc(c.title)+'</strong><span>'+percent(c)+' %</span></div><div class="bar" style="margin-top:13px"><div style="width:'+percent(c)+'%"></div></div><p class="muted small">'+done(c.id)+' / '+c.lessons.length+' leçons validées '+(percent(c)===100?'· Parcours terminé':'')+'</p></div>').join("")+'</div>'}else{const c=courses.find(x=>x.id===selected),l=c.lessons[step];a.innerHTML='<div class="panel"><div class="muted">'+esc(c.tag)+' · Leçon '+(step+1)+' / '+c.lessons.length+'</div><h2>'+esc(c.title)+' — '+esc(l.title)+'</h2><p>'+esc(l.content)+'</p><h3>Vérifie tes connaissances</h3><p>'+esc(l.q)+'</p><form id="quiz" class="stack">'+l.options.map((o,i)=>'<label class="panel" style="padding:12px"><input type="radio" name="answer" value="'+i+'" required> '+esc(o)+'</label>').join("")+'<div class="flex"><button class="primary" type="submit">Valider la réponse</button><button id="prev" class="secondary" type="button" '+(step===0?"disabled":"")+'>Précédent</button><button id="next" class="secondary" type="button" '+(step===c.lessons.length-1?"disabled":"")+'>Suivant</button></div></form><p id="feedback" role="status"></p></div>';document.getElementById("quiz").onsubmit=e=>{e.preventDefault();const val=Number(new FormData(e.target).get("answer")),ok=val===l.correct;document.getElementById("feedback").textContent=ok?"Bonne réponse ! Leçon validée.":"Ce n'est pas la bonne réponse. Relis la leçon et réessaie.";if(ok){state[c.id]??={};state[c.id][step]=true;save()}};document.getElementById("prev").onclick=()=>{step--;render()};document.getElementById("next").onclick=()=>{step++;render()};}}
function cards(){return '<div class="grid">'+courses.map(c=>'<article class="panel"><span class="pill">'+esc(c.tag)+'</span><h3>'+esc(c.title)+'</h3><p class="muted">'+esc(c.desc)+'</p><div class="bar"><div style="width:'+percent(c)+'%"></div></div><p class="muted small">'+percent(c)+' % terminé</p><button class="primary open" data-id="'+c.id+'">Commencer / reprendre</button></article>').join("")+'</div>'}
document.addEventListener("click",e=>{const nav=e.target.closest("[data-view]");if(nav){view=nav.dataset.view;render()}const open=e.target.closest(".open");if(open){selected=open.dataset.id;step=0;view="learn";render()}});document.getElementById("reset").onclick=()=>{if(confirm("Effacer toute la progression locale de la démo ?")){state={};save();render()}};render();
</script></body></html>
